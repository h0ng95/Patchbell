name: Deploy Patchbell homepage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patchbell-deploy-site
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare site downloads
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure downloads and homepage settings
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHBELL_SUPPORT_URL: ${{ vars.PATCHBELL_SUPPORT_URL }}
          PATCHBELL_GA_MEASUREMENT_ID: ${{ vars.PATCHBELL_GA_MEASUREMENT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/latest`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
            },
          });
          const names = { windows: 'Patchbell-Windows-x64.zip', macos: 'Patchbell-macOS.dmg' };
          const downloads = {};
          if (response.ok) {
            const release = await response.json();
            for (const [platform, name] of Object.entries(names)) {
              const asset = release.assets.find(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0);
              if (!asset?.browser_download_url) throw new Error(`Missing published download ${name}`);
              downloads[platform] = { url: asset.browser_download_url, version: release.tag_name.slice(1) };
            }
          } else if (response.status === 404) {
            console.log('No public release yet. The homepage will show downloads as coming soon.');
          } else {
            throw new Error(`Could not look up the latest release (HTTP ${response.status})`);
          }
          const support = process.env.PATCHBELL_SUPPORT_URL ?? '';
          const analyticsId = (process.env.PATCHBELL_GA_MEASUREMENT_ID ?? '').trim();
          if (analyticsId && !/^G-[A-Z0-9]+$/.test(analyticsId)) {
            throw new Error('PATCHBELL_GA_MEASUREMENT_ID must be a GA4 measurement ID.');
          }
          writeFileSync('dist/downloads.js',
            `window.patchbellReleases = ${JSON.stringify(downloads, null, 2)};\n` +
            `window.patchbellSupportUrl = ${JSON.stringify(support)};\n` +
            `window.patchbellAnalyticsId = ${JSON.stringify(analyticsId)};\n`);
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy download site
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
